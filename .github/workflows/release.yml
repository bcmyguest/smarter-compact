name: Release

# Publishes a tag: tests, npm trusted publishing, GitHub Release with git-cliff notes.
# prepare-release.yml dispatches this on the tag; a manual tag push also works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Check tag against package.json
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run this workflow on a tag ref"; exit 1; }
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          v=$(jq -r .version package.json)
          [ "v$v" = "$TAG" ] || { echo "::error::package.json has $v, tag is $TAG"; exit 1; }

  test:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: python3 -m unittest discover -s proxy/tests
      - run: npm test
      - run: npm run pack:check

  publish-npm:
    name: Publish to npm (trusted publishing)
    needs: [gate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run pack:check
      - name: npm publish (skips a version already on the registry)
        run: |
          set -euo pipefail
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm."
          else
            npm publish --provenance --access public
          fi

  github-release:
    name: GitHub Release
    needs: [gate, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # git-cliff here hits the same /pulls call as prepare-release.yml (see there).
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.tag }}
          fetch-depth: 0
      - name: Release notes (git-cliff)
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
      - id: npm
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          body: |
            ${{ steps.notes.outputs.content }}

            ---

            ### npm

            ```shell
            npm install -g smarter-compact@${{ steps.npm.outputs.version }}
            ```

            Registry: https://www.npmjs.com/package/smarter-compact/v/${{ steps.npm.outputs.version }}
